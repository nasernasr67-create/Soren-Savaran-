<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سورن سوار</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1220;--card:#131c2f;--card2:#1b2742;--tx:#e8edf7;--mut:#8fa0bf;--ac:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}html.big{font-size:21px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:#0b1220ee;backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
header img{width:40px;height:40px;border-radius:10px}
header h1{font-size:1.15rem;margin:0;flex:1}
.chip{background:var(--card2);border:0;color:var(--tx);padding:8px 12px;border-radius:20px;font:inherit;font-size:.9rem}
main{max-width:920px;margin:0 auto;padding:12px 14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.ic{font-size:1.6rem;width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--card2);border-radius:12px}
.t{font-weight:700}.m{color:var(--mut);font-size:.88rem;margin-top:2px}
.badge{padding:3px 10px;border-radius:12px;font-size:.8rem;font-weight:700;flex:none}
.ok{background:#14532d;color:#86efac}.soon{background:#78350f;color:#fcd34d}.over{background:#7f1d1d;color:#fca5a5}
button.b{background:var(--ac);color:#04121f;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;min-height:46px}
button.b.g{background:var(--card2);color:var(--tx)}
button.b.d{background:#7f1d1d;color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:#0e1628;display:flex;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #1e2b49;z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:.75rem;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
nav button span{font-size:1.4rem}
nav button.on{color:var(--ac)}
input,select,textarea{width:100%;background:#0b1220;color:var(--tx);border:1px solid #2a3a5f;border-radius:10px;padding:11px;font:inherit;margin:4px 0 10px}
label{font-size:.85rem;color:var(--mut)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.sheet h3{margin:0 0 12px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#e8edf7;color:#0b1220;padding:10px 16px;border-radius:12px;display:none;z-index:30;max-width:90%}
h2{font-size:1.1rem;margin:4px 2px 12px}
.tog{display:flex;gap:8px;flex-wrap:wrap}
p.m{line-height:1.8}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <h1>سورن سوار</h1>
  <button class="chip" id="odo" onclick="odoForm()">۰ km</button>
</header>
<main id="view"></main>
<nav>
  <button data-t="home" onclick="go('home')"><span>🏠</span>خانه</button>
  <button data-t="rem" onclick="go('rem')"><span>🔔</span>یادآورها</button>
  <button data-t="log" onclick="go('log')"><span>🔧</span>سرویس‌ها</button>
  <button data-t="fuel" onclick="go('fuel')"><span>⛽</span>سوخت</button>
  <button data-t="set" onclick="go('set')"><span>⚙️</span>تنظیمات</button>
</nav>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* ---------- تاریخ شمسی ---------- */
function g2j(gy,gm,gd){var g=[0,31,59,90,120,151,181,212,243,273,304,334];var jy=(gy>1600)?979:0;gy-=(gy>1600)?1600:621;var gy2=(gm>2)?(gy+1):gy;var days=(365*gy)+(~~((gy2+3)/4))-(~~((gy2+99)/100))+(~~((gy2+399)/400))-80+gd+g[gm-1];jy+=33*~~(days/12053);days%=12053;jy+=4*~~(days/1461);days%=1461;if(days>365){jy+=~~((days-1)/365);days=(days-1)%365}var jm=(days<186)?1+~~(days/31):7+~~((days-186)/30);var jd=1+((days<186)?(days%31):((days-186)%30));return[jy,jm,jd]}
function j2g(jy,jm,jd){var gy=(jy>979)?1600:621;jy-=(jy>979)?979:0;var days=(365*jy)+(~~(jy/33))*8+~~(((jy%33)+3)/4)+78+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);gy+=400*~~(days/146097);days%=146097;if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++}gy+=4*~~(days/1461);days%=1461;if(days>365){gy+=~~((days-1)/365);days=(days-1)%365}var gd=days+1;var sa=[0,31,((gy%4==0&&gy%100!=0)||(gy%400==0))?29:28,31,30,31,30,31,31,30,31,30,31];var gm;for(gm=0;gm<13;gm++){var v=sa[gm];if(gd<=v)break;gd-=v}return[gy,gm,gd]}

/* ---------- ابزارها ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const num=n=>fa(Math.round(Number(n)||0).toLocaleString('en-US').replace(/,/g,'٬'));
const en=s=>String(s==null?'':s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[,٬]/g,'').trim();
const N=s=>{const v=en(s);return v===''?null:(isNaN(Number(v))?null:Number(v))};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const isoToJ=iso=>{if(!iso)return'';const p=iso.split('-').map(Number);const j=g2j(p[0],p[1],p[2]);return fa(j[0]+'/'+pad(j[1])+'/'+pad(j[2]))};
function jToISO(t){t=en(t);if(!t)return'';const m=t.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);if(!m)return null;let y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return null;if(y>1700)return y+'-'+pad(mo)+'-'+pad(d);const g=j2g(y,mo,d);return g[0]+'-'+pad(g[1])+'-'+pad(g[2])}
function addMonths(iso,n){const p=iso.split('-').map(Number);let j=g2j(p[0],p[1],p[2]);let m=j[1]-1+n;let y=j[0]+Math.floor(m/12);m=((m%12)+12)%12+1;const maxd=m<=6?31:(m<=11?30:29);const g=j2g(y,m,Math.min(j[2],maxd));return g[0]+'-'+pad(g[1])+'-'+pad(g[2])}
function diffDays(a,b){const A=a.split('-').map(Number),B=b.split('-').map(Number);return Math.round((Date.UTC(B[0],B[1]-1,B[2])-Date.UTC(A[0],A[1]-1,A[2]))/864e5)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ---------- داده ---------- */
const KEY='soren-savar-v1';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.rem)return d}catch(e){}return{odo:0,car:'سورن پلاس',rem:[],logs:[],fuel:[],notified:{},big:false,setup:false}}
let S=load();S.tab=S.tab||'home';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncNative()}

const PRESETS=[
{t:'تعویض روغن موتور',i:'🛢️',rm:6,rk:5000,ld:14,lk:500},
{t:'معاینه فنی',i:'📋',rm:12,ld:30,lk:0},
{t:'بیمه شخص ثالث',i:'🛡️',rm:12,ld:30,lk:0},
{t:'بیمه بدنه',i:'🛡️',rm:12,ld:30,lk:0},
{t:'گواهینامه',i:'🪪',ld:60,lk:0},
{t:'عوارض سالانه',i:'💳',rm:12,ld:30,lk:0},
{t:'تعویض فیلتر هوا',i:'🌬️',rk:15000,rm:12,ld:14,lk:1000},
{t:'تعویض فیلتر بنزین',i:'⛽',rk:20000,ld:14,lk:1000},
{t:'تعویض شمع',i:'⚡',rk:30000,ld:14,lk:1000},
{t:'لنت ترمز',i:'🛑',rk:30000,ld:14,lk:1000},
{t:'روغن ترمز',i:'🛑',rm:24,ld:30,lk:0},
{t:'ضدیخ / مایع خنک‌کننده',i:'❄️',rm:24,ld:30,lk:0},
{t:'روغن گیربکس',i:'⚙️',rk:60000,ld:30,lk:2000},
{t:'تسمه تایم',i:'🔗',rk:60000,ld:30,lk:2000},
{t:'تعویض / بادگیری تایر',i:'🛞',rk:10000,ld:14,lk:500},
{t:'باتری',i:'🔋',rm:24,ld:30,lk:0},
{t:'سرویس دوره‌ای',i:'🧰',rk:10000,rm:6,ld:14,lk:500}
];
const LBL={ok:'عادی',soon:'نزدیک',over:'گذشته'};
function st(r){let d=null,k=null,s='ok';
 if(r.date)d=diffDays(todayISO(),r.date);
 if(r.km!=null&&r.km!=='')k=r.km-S.odo;
 if((d!==null&&d<0)||(k!==null&&k<0))s='over';
 else if((d!==null&&d<=(r.leadD==null?14:r.leadD))||(k!==null&&k<=(r.leadK==null?500:r.leadK)))s='soon';
 return{d,k,state:s}}
function desc(s){const p=[];if(s.d!==null)p.push(s.d<0?fa(-s.d)+' روز گذشته':s.d===0?'امروز':fa(s.d)+' روز مانده');if(s.k!==null)p.push(s.k<0?num(-s.k)+' کیلومتر گذشته':num(s.k)+' کیلومتر مانده');return p.join(' • ')||'بدون سررسید'}
function cmp(a,b){const R={over:0,soon:1,ok:2};if(R[a.s.state]!==R[b.s.state])return R[a.s.state]-R[b.s.state];const ad=a.s.d==null?1e9:a.s.d,bd=b.s.d==null?1e9:b.s.d;if(ad!==bd)return ad-bd;return(a.s.k==null?1e9:a.s.k)-(b.s.k==null?1e9:b.s.k)}

/* ---------- مودال ---------- */
function modal(title,body,onSave,onDel){
 const m=$('#modal');
 m.innerHTML=`<div class="sheet"><h3>${title}</h3>${body}<div class="row" style="margin-top:6px"><button class="b sp" id="m_ok">ذخیره</button>${onDel?'<button class="b d" id="m_del">حذف</button>':''}<button class="b g" id="m_no">انصراف</button></div></div>`;
 m.classList.add('on');
 $('#m_no').onclick=closeM;
 $('#m_ok').onclick=()=>{if(onSave()!==false)closeM()};
 if(onDel)$('#m_del').onclick=()=>{if(confirm('حذف شود؟')){onDel();closeM()}};
 m.onclick=e=>{if(e.target===m)closeM()};
}
function closeM(){$('#modal').classList.remove('on');$('#modal').innerHTML='';render()}
const v=id=>($('#'+id)||{}).value;

/* ---------- نمایش‌ها ---------- */
function go(t){S.tab=t;save();render();scrollTo(0,0)}
function render(){
 document.documentElement.classList.toggle('big',!!S.big);
 $('#odo').textContent=num(S.odo)+' km';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
 ({home:home,rem:remView,log:logView,fuel:fuelView,set:setView}[S.tab]||home)();
}
function remCard(x){const r=x.r,s=x.s;
 const meta=[r.date?'تاریخ: '+isoToJ(r.date):'',(r.km!=null&&r.km!=='')?'کیلومتر: '+num(r.km):''].filter(Boolean).join(' • ');
 return `<div class="card"><div class="row"><div class="ic">${r.i||'🔔'}</div><div class="sp"><div class="t">${esc(r.title)}</div><div class="m">${desc(s)}</div>${meta?`<div class="m">${meta}</div>`:''}</div><span class="badge ${s.state}">${LBL[s.state]}</span></div><div class="row" style="margin-top:10px"><button class="b sp" onclick="doneForm('${r.id}')">✔ انجام شد</button><button class="b g" onclick="remForm('${r.id}')">ویرایش</button></div></div>`}
function sorted(){return S.rem.map(r=>({r,s:st(r)})).sort(cmp)}

function home(){
 const list=sorted(),bad=list.filter(x=>x.s.state!=='ok').length;let h='';
 if(!S.setup)h+=`<div class="card"><div class="t">👋 به سورن سوار خوش آمدید</div><p class="m">چند اطلاعات اولیه بدهید تا یادآورهای روغن، معاینه فنی، بیمه و گواهینامه ساخته شود.</p><button class="b" onclick="setup()">شروع تنظیم</button></div>`;
 h+=`<div class="card row"><div class="ic">🚗</div><div class="sp"><div class="t">${esc(S.car)}</div><div class="m">کارکرد: ${num(S.odo)} کیلومتر</div></div><button class="b g" onclick="odoForm()">ثبت کیلومتر</button></div>`;
 h+=`<h2>${bad?'⚠️ '+fa(bad)+' مورد نیازمند توجه':'✅ همه چیز مرتب است'}</h2>`;
 h+='<div class="grid">'+(list.length?list.slice(0,6).map(remCard).join(''):'<div class="card m">هنوز یادآوری ثبت نشده.</div>')+'</div>';
 h+=`<div class="grid"><button class="b" onclick="logForm()">🔧 ثبت سرویس / تعمیر</button><button class="b g" onclick="fuelForm()">⛽ ثبت بنزین</button><button class="b g" onclick="remForm()">➕ یادآور جدید</button></div>`;
 $('#view').innerHTML=h;
}
function remView(){const l=sorted();$('#view').innerHTML=`<div class="row"><h2 class="sp">یادآورها</h2><button class="b" onclick="remForm()">➕ جدید</button></div><div class="grid">${l.map(remCard).join('')||'<div class="card m">چیزی ثبت نشده.</div>'}</div>`}

function odoForm(){modal('ثبت کیلومتر فعلی',`<label>کیلومتر کارکرد</label><input id="f_o" inputmode="numeric" value="${S.odo||''}">`,()=>{const o=N(v('f_o'));if(o==null||o<0){toast('عدد معتبر وارد کنید');return false}S.odo=o;save();checkNotify()})}

function setup(){
 modal('تنظیم اولیه',`<label>نام خودرو</label><input id="s_n" value="${esc(S.car)}">
 <label>کیلومتر فعلی</label><input id="s_o" inputmode="numeric" value="${S.odo||''}">
 <label>کیلومتر آخرین تعویض روغن</label><input id="s_ok" inputmode="numeric">
 <label>تاریخ آخرین تعویض روغن (مثلاً ۱۴۰۵/۰۸/۰۱)</label><input id="s_od" inputmode="numeric">
 <label>تاریخ انقضای معاینه فنی</label><input id="s_t" inputmode="numeric">
 <label>تاریخ انقضای بیمه شخص ثالث</label><input id="s_i" inputmode="numeric">
 <label>تاریخ انقضای گواهینامه</label><input id="s_l" inputmode="numeric">`,()=>{
  const ds={od:jToISO(v('s_od')),t:jToISO(v('s_t')),i:jToISO(v('s_i')),l:jToISO(v('s_l'))};
  if(Object.values(ds).some(x=>x===null)){toast('فرمت تاریخ درست نیست (مثل ۱۴۰۵/۰۳/۱۵)');return false}
  S.car=v('s_n').trim()||'سورن پلاس';const o=N(v('s_o'));if(o!=null)S.odo=o;
  const P=t=>PRESETS.find(p=>p.t===t);
  const mk=(p,date,km)=>S.rem.push({id:uid(),title:p.t,i:p.i,date:date||'',km:km==null?'':km,leadD:p.ld,leadK:p.lk,rm:p.rm||'',rk:p.rk||''});
  const ok=N(v('s_ok'));
  if(ok!=null||ds.od){const p=P('تعویض روغن موتور');mk(p,ds.od?addMonths(ds.od,p.rm):'',ok!=null?ok+p.rk:null)}
  if(ds.t)mk(P('معاینه فنی'),ds.t);if(ds.i)mk(P('بیمه شخص ثالث'),ds.i);if(ds.l)mk(P('گواهینامه'),ds.l);
  S.setup=true;save();checkNotify()})}

function remForm(id){
 const r=S.rem.find(x=>x.id===id)||{};const nw=!r.id;
 modal(nw?'یادآور جدید':'ویرایش یادآور',`
 ${nw?`<label>الگوی آماده</label><select id="f_p" onchange="applyPreset()"><option value="">سفارشی</option>${PRESETS.map((p,i)=>`<option value="${i}">${p.i} ${p.t}</option>`).join('')}</select>`:''}
 <label>عنوان</label><input id="f_t" value="${esc(r.title||'')}">
 <label>تاریخ سررسید (شمسی، مثلاً ۱۴۰۵/۰۳/۱۵)</label><input id="f_d" inputmode="numeric" value="${isoToJ(r.date)}">
 <label>کیلومتر سررسید</label><input id="f_k" inputmode="numeric" value="${r.km==null?'':r.km}">
 <label>اعلام قبل از سررسید (روز)</label><input id="f_ld" inputmode="numeric" value="${r.leadD==null?14:r.leadD}">
 <label>اعلام قبل از سررسید (کیلومتر)</label><input id="f_lk" inputmode="numeric" value="${r.leadK==null?500:r.leadK}">
 <label>تکرار هر چند ماه (اختیاری)</label><input id="f_rm" inputmode="numeric" value="${r.rm==null?'':r.rm}">
 <label>تکرار هر چند کیلومتر (اختیاری)</label><input id="f_rk" inputmode="numeric" value="${r.rk==null?'':r.rk}">`,
 ()=>{const t=v('f_t').trim();if(!t){toast('عنوان را وارد کنید');return false}
  const d=jToISO(v('f_d'));if(d===null){toast('فرمت تاریخ درست نیست');return false}
  const k=N(v('f_k'));if(!d&&k==null){toast('حداقل تاریخ یا کیلومتر را وارد کنید');return false}
  const o={id:r.id||uid(),title:t,i:r.i||window._pi||'🔔',date:d,km:k==null?'':k,leadD:N(v('f_ld'))??14,leadK:N(v('f_lk'))??500,rm:N(v('f_rm'))||'',rk:N(v('f_rk'))||''};
  if(nw)S.rem.push(o);else S.rem[S.rem.findIndex(x=>x.id===r.id)]=o;
  window._pi=null;save();checkNotify()},
 nw?null:()=>{S.rem=S.rem.filter(x=>x.id!==r.id);save()});
}
function applyPreset(){const i=v('f_p');if(i==='')return;const p=PRESETS[i];window._pi=p.i;
 $('#f_t').value=p.t;$('#f_ld').value=p.ld??14;$('#f_lk').value=p.lk??500;$('#f_rm').value=p.rm||'';$('#f_rk').value=p.rk||'';
 if(p.rk&&!$('#f_k').value)$('#f_k').value=S.odo+p.rk;
 if(p.rm&&!$('#f_d').value)$('#f_d').value=isoToJ(addMonths(todayISO(),p.rm))}

function doneForm(id){
 const r=S.rem.find(x=>x.id===id);if(!r)return;
 const nd=r.rm?addMonths(todayISO(),Number(r.rm)):'';const nk=r.rk?S.odo+Number(r.rk):'';
 modal('ثبت انجام: '+esc(r.title),`
 <label>تاریخ انجام</label><input id="d_d" value="${isoToJ(todayISO())}">
 <label>کیلومتر فعلی</label><input id="d_k" inputmode="numeric" value="${S.odo||''}">
 <label>هزینه (تومان)</label><input id="d_c" inputmode="numeric">
 <label>توضیح (اختیاری)</label><input id="d_n">
 <label>سررسید بعدی - تاریخ</label><input id="d_nd" value="${isoToJ(nd)}">
 <label>سررسید بعدی - کیلومتر</label><input id="d_nk" inputmode="numeric" value="${nk}">`,()=>{
  const dd=jToISO(v('d_d'))||todayISO();const ndd=jToISO(v('d_nd'));if(ndd===null){toast('فرمت تاریخ بعدی درست نیست');return false}
  const k=N(v('d_k'));if(k!=null&&k>S.odo)S.odo=k;
  S.logs.push({id:uid(),date:dd,km:k==null?S.odo:k,title:r.title,cost:N(v('d_c'))||0,note:v('d_n').trim()});
  r.date=ndd||'';const nkk=N(v('d_nk'));r.km=nkk==null?'':nkk;delete S.notified[r.id];save();toast('ثبت شد ✔')});
}

function logView(){
 const l=[...S.logs].sort((a,b)=>b.date.localeCompare(a.date)),tot=l.reduce((s,x)=>s+(x.cost||0),0);
 $('#view').innerHTML=`<div class="row"><h2 class="sp">سرویس‌ها و تعمیرات</h2><button class="b" onclick="logForm()">➕ ثبت</button></div>
 <div class="card row"><div class="ic">💰</div><div class="sp"><div class="t">مجموع هزینه‌ها</div><div class="m">${num(tot)} تومان</div></div></div>
 ${l.map(x=>`<div class="card" onclick="logForm('${x.id}')"><div class="row"><div class="sp"><div class="t">${esc(x.title)}</div><div class="m">${isoToJ(x.date)} • ${num(x.km)} km</div>${x.note?`<div class="m">${esc(x.note)}</div>`:''}</div><div class="t">${x.cost?num(x.cost)+' ت':''}</div></div></div>`).join('')||'<div class="card m">هنوز چیزی ثبت نشده.</div>'}`;
}
function logForm(id){
 const x=S.logs.find(l=>l.id===id)||{};const nw=!x.id;
 modal(nw?'ثبت سرویس / تعمیر':'ویرایش',`
 <label>کار انجام‌شده</label><input id="l_t" value="${esc(x.title||'')}" placeholder="مثلاً تعویض لنت جلو">
 <label>تاریخ</label><input id="l_d" value="${isoToJ(x.date||todayISO())}">
 <label>کیلومتر</label><input id="l_k" inputmode="numeric" value="${x.km==null?S.odo:x.km}">
 <label>هزینه (تومان)</label><input id="l_c" inputmode="numeric" value="${x.cost||''}">
 <label>توضیح</label><input id="l_n" value="${esc(x.note||'')}">`,()=>{
  const t=v('l_t').trim();if(!t){toast('عنوان را وارد کنید');return false}
  const d=jToISO(v('l_d'))||todayISO();const k=N(v('l_k'));
  const o={id:x.id||uid(),title:t,date:d,km:k==null?S.odo:k,cost:N(v('l_c'))||0,note:v('l_n').trim()};
  if(k!=null&&k>S.odo)S.odo=k;
  if(nw)S.logs.push(o);else S.logs[S.logs.findIndex(l=>l.id===x.id)]=o;save()},
 nw?null:()=>{S.logs=S.logs.filter(l=>l.id!==x.id);save()});
}

function fuelStats(){
 const f=[...S.fuel].sort((a,b)=>a.km-b.km);let lastK=null,acc=0;const res={};
 f.forEach(r=>{if(lastK!==null)acc+=r.l;if(r.full){if(lastK!==null&&r.km>lastK)res[r.id]=acc/(r.km-lastK)*100;lastK=r.km;acc=0}});
 const vals=Object.values(res);return{res,avg:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null}}
function fuelView(){
 const l=[...S.fuel].sort((a,b)=>b.km-a.km),s=fuelStats(),tot=l.reduce((a,x)=>a+(x.cost||0),0);
 $('#view').innerHTML=`<div class="row"><h2 class="sp">سوخت</h2><button class="b" onclick="fuelForm()">➕ ثبت</button></div>
 <div class="grid"><div class="card row"><div class="ic">📉</div><div class="sp"><div class="t">میانگین مصرف</div><div class="m">${s.avg?fa(s.avg.toFixed(1))+' لیتر در ۱۰۰ کیلومتر':'پس از دو بار باک پر ثبت می‌شود'}</div></div></div>
 <div class="card row"><div class="ic">💰</div><div class="sp"><div class="t">مجموع هزینه سوخت</div><div class="m">${num(tot)} تومان</div></div></div></div>
 ${l.map(x=>`<div class="card" onclick="fuelForm('${x.id}')"><div class="row"><div class="sp"><div class="t">${fa(x.l)} لیتر ${x.full?'(باک پر)':''}</div><div class="m">${isoToJ(x.date)} • ${num(x.km)} km</div></div><div><div class="t">${x.cost?num(x.cost)+' ت':''}</div>${s.res[x.id]?`<div class="m">${fa(s.res[x.id].toFixed(1))} L/100</div>`:''}</div></div></div>`).join('')}`;
}
function fuelForm(id){
 const x=S.fuel.find(l=>l.id===id)||{};const nw=!x.id;
 modal(nw?'ثبت سوخت‌گیری':'ویرایش',`
 <label>تاریخ</label><input id="u_d" value="${isoToJ(x.date||todayISO())}">
 <label>کیلومتر</label><input id="u_k" inputmode="numeric" value="${x.km==null?S.odo:x.km}">
 <label>لیتر</label><input id="u_l" inputmode="decimal" value="${x.l||''}">
 <label>مبلغ (تومان)</label><input id="u_c" inputmode="numeric" value="${x.cost||''}">
 <label><input type="checkbox" id="u_f" style="width:auto;margin-left:8px" ${x.full!==false?'checked':''}>باک را پر کردم</label>`,()=>{
  const k=N(v('u_k')),l=N(v('u_l'));if(k==null||!l){toast('کیلومتر و لیتر را وارد کنید');return false}
  const d=jToISO(v('u_d'))||todayISO();
  const o={id:x.id||uid(),date:d,km:k,l:l,cost:N(v('u_c'))||0,full:$('#u_f').checked};
  if(k>S.odo)S.odo=k;
  if(nw)S.fuel.push(o);else S.fuel[S.fuel.findIndex(r=>r.id===x.id)]=o;save()},
 nw?null:()=>{S.fuel=S.fuel.filter(r=>r.id!==x.id);save()});
}

function setView(){
 const native=!!LN();
 const np=native?'native':('Notification' in window?Notification.permission:'unsupported');
 $('#view').innerHTML=`
 <div class="card"><div class="t">🚗 خودرو</div><label>نام خودرو</label><input id="c_n" value="${esc(S.car)}" onchange="S.car=this.value.trim()||'سورن پلاس';save()">
 <div class="row"><button class="b ${S.big?'':'g'} sp" onclick="S.big=!S.big;save();render()">🖥️ حالت خودرو (دکمه و متن بزرگ): ${S.big?'روشن':'خاموش'}</button></div></div>
 <div class="card"><div class="t">🔔 اعلان‌ها</div>
 <p class="m">${np==='native'?'برای یادآورهای تاریخ‌دار، ساعت ۹ صبح در روز هشدار، یک روز قبل و روز سررسید اعلان زمان‌بندی می‌شود (حتی وقتی اپ بسته است). یادآورهای کیلومتری هنگام باز کردن اپ یا ثبت کیلومتر اعلام می‌شوند. اگر اعلان نمی‌آید دکمه فعال‌سازی را بزنید.':'وضعیت: '+(np==='granted'?'فعال':np==='denied'?'مسدود (از تنظیمات مرورگر باز کنید)':np==='unsupported'?'پشتیبانی نمی‌شود':'غیرفعال')+'.<br>اعلان هنگام باز شدن اپ برای موارد نزدیک یا گذشته نمایش داده می‌شود. برای هشدار مطمئن در پس‌زمینه، «افزودن به تقویم» را بزنید یا نسخه APK را نصب کنید.'}</p>
 <div class="row" style="flex-wrap:wrap"><button class="b" onclick="askNotif()">فعال‌سازی اعلان</button><button class="b g" onclick="testNotif()">آزمایش</button></div></div>
 <div class="card"><div class="t">📅 تقویم گوشی</div><p class="m">فایل تقویم همه یادآورهای تاریخ‌دار را می‌سازد؛ با باز کردن آن در گوشی، هشدارها حتی بدون باز کردن اپ می‌آیند. یادآورهای کیلومتری در تقویم نیستند.</p><button class="b" onclick="ics()">⬇ دریافت فایل تقویم</button></div>
 <div class="card"><div class="t">💾 پشتیبان‌گیری</div><p class="m">اطلاعات فقط روی همین دستگاه ذخیره می‌شود. گاهی نسخه پشتیبان بگیرید.</p>
 <div class="row" style="flex-wrap:wrap"><button class="b" onclick="backup()">⬇ دریافت پشتیبان</button><button class="b g" onclick="$('#rf').click()">⬆ بازیابی</button><input type="file" id="rf" accept=".json" hidden onchange="restore(this.files[0])"></div></div>
 <div class="card"><div class="row" style="flex-wrap:wrap"><button class="b g" onclick="setup()">تنظیم اولیه دوباره</button><button class="b d" onclick="resetAll()">پاک کردن همه اطلاعات</button></div></div>
 <p class="m" style="text-align:center">سورن سوار • نسخه ۱</p>`;
}
/* ---------- اعلان‌ها (وب + نسخه APK) ---------- */
var LN=function(){try{return window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()?Capacitor.Plugins.LocalNotifications:null}catch(e){return null}};
async function notifOK(){const ln=LN();if(ln){try{return(await ln.checkPermissions()).display==='granted'}catch(e){return false}}return('Notification' in window)&&Notification.permission==='granted'}
async function askNotif(){const ln=LN();if(ln){try{await ln.requestPermissions()}catch(e){}render();syncNative();checkNotify();return}
 if(!('Notification' in window)){toast('مرورگر اعلان را پشتیبانی نمی‌کند');return}await Notification.requestPermission();render();checkNotify()}
async function testNotif(){if(!(await notifOK())){toast('اول اعلان را فعال کنید');return}show('سورن سوار','اعلان آزمایشی ✔','test')}
async function show(title,body,tag){
 const ln=LN();if(ln){try{await ln.schedule({notifications:[{id:Math.floor(Math.random()*1e9)+1,title:title,body:body,schedule:{at:new Date(Date.now()+1500)}}]})}catch(e){}return}
 try{const reg=await navigator.serviceWorker.getRegistration();if(reg){await reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',lang:'fa',dir:'rtl',tag:tag});return}}catch(e){}try{new Notification(title,{body,icon:'icon-192.png',tag:tag})}catch(e){}}
async function checkNotify(){
 if(!(await notifOK()))return;const t=todayISO();
 S.rem.forEach(r=>{const s=st(r);if(s.state==='ok'||S.notified[r.id]===t)return;S.notified[r.id]=t;show((s.state==='over'?'⚠️ سررسید گذشته: ':'🔔 نزدیک سررسید: ')+r.title,desc(s),r.id)});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* زمان‌بندی اعلان برای یادآورهای تاریخ‌دار (فقط نسخه APK): ساعت ۹ صبح، در روز هشدار، ۱ روز قبل و روز سررسید */
var _sn;
function syncNative(){clearTimeout(_sn);_sn=setTimeout(doSync,800)}
async function doSync(){
 const ln=LN();if(!ln)return;
 try{
  if(!(await notifOK()))return;
  const pend=await ln.getPending();
  if(pend.notifications&&pend.notifications.length)await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  const out=[];let id=1;const now=Date.now();
  S.rem.forEach(r=>{if(!r.date)return;const p=r.date.split('-').map(Number);const lead=r.leadD==null?14:r.leadD;
   const offs=[];[lead,1,0].forEach(o=>{if(o>=0&&offs.indexOf(o)<0)offs.push(o)});
   offs.forEach(o=>{const at=new Date(p[0],p[1]-1,p[2]-o,9,0,0);if(at.getTime()<=now)return;
    out.push({id:id++,title:(o===0?'⚠️ امروز سررسید است: ':'🔔 '+fa(o)+' روز تا سررسید: ')+r.title,body:S.car,schedule:{at:at,allowWhileIdle:true}})})});
  if(out.length)await ln.schedule({notifications:out});
 }catch(e){}
}
function ics(){
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SorenSavar//FA//EN','CALSCALE:GREGORIAN'];let n=0;
 S.rem.filter(r=>r.date).forEach(r=>{n++;const d=r.date.replace(/-/g,'');const e=new Date(r.date+'T00:00:00Z');e.setUTCDate(e.getUTCDate()+1);const de=e.toISOString().slice(0,10).replace(/-/g,'');
 L.push('BEGIN:VEVENT','UID:'+r.id+'@soren-savar','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+de,'SUMMARY:'+r.title+' ('+S.car+')',
 'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+r.title,'TRIGGER:-P'+(r.leadD||14)+'D','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+r.title,'TRIGGER:-P1D','END:VALARM','END:VEVENT')});
 L.push('END:VCALENDAR');if(!n){toast('یادآور تاریخ‌دار وجود ندارد');return}download('soren-savar.ics',L.join('\r\n'),'text/calendar')}
function backup(){download('soren-savar-backup.json',JSON.stringify(S),'application/json')}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.rem)throw 0;S=d;S.tab='set';save();render();toast('بازیابی شد ✔')}catch(e){toast('فایل معتبر نیست')}};r.readAsText(f)}
function resetAll(){if(confirm('همه اطلاعات پاک شود؟ این کار برگشت‌پذیر نیست.')){localStorage.removeItem(KEY);S=load();S.tab='home';render()}}

if(!LN()&&'serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(LN()&&!S.askedNotif){S.askedNotif=true;save();setTimeout(askNotif,1200)}
syncNative();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();checkNotify()}});
setInterval(checkNotify,30*60*1000);
render();checkNotify();
</script>
</body>
</html>
